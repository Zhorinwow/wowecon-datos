name: Recolectar subastas

# Una recogida cada hora o cada tres horas, sin depender del horario de GitHub: cada
# ejecución espera en un entorno con temporizador (sin ocupar ninguna máquina), recoge
# en medio minuto y lanza la siguiente. La variable WOWECON_RITMO elige el ritmo:
# «espera-1h» = 55 minutos (si no existe), «espera» = 170 minutos. El horario de abajo solo vuelve a
# arrancar la cadena si alguna vez se rompe.
on:
  schedule:
    - cron: '34 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    environment: ${{ vars.WOWECON_RITMO || 'espera-1h' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recuperar el libro de la recogida anterior
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: libro-${{ github.run_id }}
          restore-keys: libro-

      - name: Traer los datos ya guardados
        run: |
          git clone --depth 1 --branch data https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git datos || mkdir datos
          rm -rf datos/.git

      - name: Descargar las casas de subastas
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          WOWECON_REGION: ${{ vars.WOWECON_REGION || 'eu' }}
          WOWECON_HOUSES: ${{ vars.WOWECON_HOUSES || '110 116' }}
          WOWECON_KEEP_DAYS: ${{ vars.WOWECON_KEEP_DAYS || '21' }}
        run: python recolectar.py datos estado

      - name: Guardar los datos en la rama data
        run: |
          cd datos
          git init -q -b data
          git config user.name wowecon
          git config user.email wowecon@users.noreply.github.com
          git add -A
          git commit -q -m datos-$(date -u +%Y%m%dT%H%MZ)
          git push -q -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git data

      - name: Guardar el libro para la recogida siguiente
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado
          key: libro-${{ github.run_id }}

      - name: Lanzar la recogida siguiente
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run recolectar.yml --ref main --repo ${{ github.repository }}
